services:
  wenxi:
    build: .
    container_name: wenxi-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      WENXI_DATA_DIR: /data
    volumes:
      - wenxi_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  nginx:
    image: nginx:1.27-alpine
    container_name: wenxi-nginx
    restart: unless-stopped
    depends_on:
      wenxi:
        condition: service_healthy
    ports:
      - "${WENXI_HTTP_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/api/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  wenxi_data:
