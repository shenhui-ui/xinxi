name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 20 LTS：better-sqlite3@11.3 有预编译产物，npm ci 无需本地编译
          node-version: '20.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # node --test test/（Node 内置测试运行器，18 个测试文件，自建临时库、注入 fakeProvider，联网）
      - name: Run tests
        run: npm test

      # check-blocks.mjs（前后端区块映射静态校验）+ vite build
      - name: Build
        run: npm run build
